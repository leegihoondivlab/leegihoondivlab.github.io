<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivLab - 차세대 AI 추론 엔진</title>
    <style>
        /* 딥테크 감성의 다크 테마 배경 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 0 20px;
        }
        /* 상태 뱃지 (영리 활동 아님을 증명) */
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #00C9FF;
            background-color: rgba(0, 201, 255, 0.1);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        /* 메인 로고 타이포그래피 (그라데이션 효과) */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin: 0 0 20px 0;
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        /* 서브 카피 */
        p.subtitle {
            font-size: 1.5rem;
            color: #a0a0a0;
            margin-bottom: 50px;
            word-break: keep-all;
            line-height: 1.6;
        }
        /* 예비창업자 신분 명시 푸터 */
        footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 고용센터 방어용: 현재는 준비 중임을 명확히 함 -->
        <div class="status-badge">2027년 상반기 정식 서비스 오픈 준비 중 (Beta)</div>
        
        <h1>DivLab</h1>
        <p class="subtitle">보이지 않는 데이터의 이격을 읽다.<br>차세대 AI 추론 엔진</p>
    </div>
    
    <footer>
        디브랩(DivLab) | 예비창업자 이기훈
    </footer>
</body>
</html>
